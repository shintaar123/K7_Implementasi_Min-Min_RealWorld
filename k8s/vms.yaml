apiVersion: v1
kind: Pod
metadata:
  name: vm-0
  labels: {soka-vm: "0"}
spec:
  nodeSelector: {soka-host: host-1}
  containers:
  - name: worker
    image: python:3.11-slim
    imagePullPolicy: IfNotPresent
    command: ["python", "/app/worker.py"]
    ports: [{containerPort: 8080}]
    env:
    - {name: VM_ID, value: "0"}
    - {name: VM_MIPS, value: "1000"}
    - {name: CPU_LIMIT, value: "0.25"}
    - {name: TIME_SCALE, value: "0.05"}
    - {name: OPS_PER_MI, value: "250"}
    - {name: MODE, value: "cpu"}
    - {name: MIPS_PER_CORE, value: "4000"}
    - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
    resources:
      requests: {cpu: "250m", memory: 256Mi}
      limits:   {cpu: "250m", memory: 256Mi}
    volumeMounts: [{name: code, mountPath: /app}]
  volumes: [{name: code, configMap: {name: soka-code}}]
---
apiVersion: v1
kind: Service
metadata: {name: vm-0}
spec:
  selector: {soka-vm: "0"}
  ports: [{port: 8080, targetPort: 8080}]
---
